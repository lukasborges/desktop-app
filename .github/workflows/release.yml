name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !contains(github.event.head_commit.message, '[skip release]')
    runs-on: ubuntu-latest
    outputs:
      next_n: ${{ steps.version.outputs.next_n }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next fork version
        id: version
        shell: bash
        run: |
          last_n=$(git tag --list 'v3.3.0-fork.*' | sed 's/.*\.//' | sort -n | tail -1)
          next_n=$((${last_n:-0} + 1))
          tag="v3.3.0-fork.${next_n}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "next_n=${next_n}" >> "$GITHUB_OUTPUT"
          echo "Next release tag: ${tag}"

  build-linux:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            graphicsmagick libxtst-dev libx11-dev \
            rpm

      - name: Install Node dependencies
        run: yarn install --immutable

      - name: Bump package version
        run: bash scripts/bump-version.sh "${{ needs.prepare.outputs.next_n }}"

      - name: Generate release notes from commits
        run: node scripts/generate-release-notes.mjs

      - name: Build workspaces
        run: yarn build

      - name: Build Linux installers
        working-directory: packages/app
        env:
          NODE_ENV: production
        run: yarn exec electron-builder --linux AppImage --linux deb

      - name: Build RPM
        run: bash scripts/build-rpm.sh

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ github.sha }}
          if-no-files-found: error
          retention-days: 1
          path: |
            release/Platform-x86_64.AppImage
            release/Platform-amd64.deb
            release/Platform-x86_64.rpm
            release/latest-linux.yml

  build-windows:
    needs: prepare
    # node-gyp 10 cannot detect the Visual Studio 18 installation on
    # windows-latest yet. windows-2022 provides Visual Studio 2022 and ATL.
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enable Corepack
        run: corepack enable

      - name: Install Node dependencies
        run: yarn install --immutable

      - name: Verify Windows SQLite dependency
        shell: pwsh
        run: |
          $bindingRoot = "node_modules/sqlite3/lib/binding"
          $windowsBinary = Get-ChildItem -LiteralPath $bindingRoot -Recurse -Filter node_sqlite3.node |
            Where-Object { $_.FullName -match 'napi-v6-win32-.*-x64' }
          $foreignBinary = Get-ChildItem -LiteralPath $bindingRoot -Recurse -Filter node_sqlite3.node |
            Where-Object { $_.FullName -match 'linux|darwin' }

          if (-not $windowsBinary) {
            throw "sqlite3 does not contain a Windows x64 native binary"
          }
          if ($foreignBinary) {
            throw "sqlite3 contains a foreign native binary: $($foreignBinary.FullName)"
          }

          Write-Output "Using sqlite3 binary: $($windowsBinary.FullName)"

      - name: Bump package version
        shell: bash
        run: bash scripts/bump-version.sh "${{ needs.prepare.outputs.next_n }}"

      - name: Generate release notes from commits
        run: node scripts/generate-release-notes.mjs

      - name: Build workspaces
        run: yarn build

      - name: Build Windows installer
        working-directory: packages/app
        env:
          NODE_ENV: production
        run: yarn exec electron-builder --win

      - name: Verify packaged Windows SQLite binary
        shell: pwsh
        run: |
          $bindingRoot = "release/win-unpacked/resources/app.asar.unpacked/node_modules/sqlite3/lib/binding"
          $windowsBinary = Get-ChildItem -LiteralPath $bindingRoot -Recurse -Filter node_sqlite3.node |
            Where-Object { $_.FullName -match 'napi-v6-win32-.*-x64' }
          $foreignBinary = Get-ChildItem -LiteralPath $bindingRoot -Recurse -Filter node_sqlite3.node |
            Where-Object { $_.FullName -match 'linux|darwin' }

          if (-not $windowsBinary) {
            throw "Packaged app does not contain the Windows sqlite3 binary"
          }
          if ($foreignBinary) {
            throw "Packaged app contains a foreign sqlite3 binary: $($foreignBinary.FullName)"
          }

          Write-Output "Packaged sqlite3 binary: $($windowsBinary.FullName)"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-${{ github.sha }}
          if-no-files-found: error
          retention-days: 1
          path: |
            release/Platform-Setup.exe
            release/Platform-Setup.exe.blockmap
            release/latest.yml

  publish:
    needs:
      - prepare
      - build-linux
      - build-windows
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release

      - name: Verify release artifacts
        shell: bash
        run: |
          set -euo pipefail
          required=(
            Platform-x86_64.AppImage
            Platform-amd64.deb
            Platform-x86_64.rpm
            Platform-Setup.exe
            Platform-Setup.exe.blockmap
            latest-linux.yml
            latest.yml
          )
          for artifact in "${required[@]}"; do
            test -s "release/${artifact}" || {
              echo "Missing or empty release artifact: ${artifact}" >&2
              exit 1
            }
          done
          ls -lh release

      - name: Create GitHub release
        shell: bash
        run: |
          notes_file=$(mktemp)
          previous_tag=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [[ -n "$previous_tag" ]]; then
            commit_notes=$(git log "${previous_tag}..${GITHUB_SHA}" --format='- %s (`%h`)' --no-merges)
          else
            commit_notes=$(git log "${GITHUB_SHA}" --format='- %s (`%h`)' --no-merges)
          fi
          {
            printf 'Automated release from commit [`%s`](%s/%s/commit/%s).\n\n' \
              "${GITHUB_SHA::7}" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA"
            printf '## Changes\n\n%s\n\n' "$commit_notes"
            printf '## Artifacts\n\n'
            printf '### Linux (x86_64)\n- `Platform-x86_64.AppImage` — distro-agnostic\n- `Platform-amd64.deb` — Debian / Ubuntu\n- `Platform-x86_64.rpm` — Fedora / RHEL (built with `scripts/build-rpm.sh`)\n\n'
            printf '### Windows (x86_64)\n- `Platform-Setup.exe` — NSIS installer (built natively on Windows)\n- `Platform-Setup.exe.blockmap` — auto-update delta metadata\n\n'
            printf '### Auto-update metadata\n- `latest-linux.yml`, `latest.yml`\n\n'
            printf 'macOS build is not included.\n'
          } > "$notes_file"

          gh release create "$TAG" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file "$notes_file" \
            release/Platform-x86_64.AppImage \
            release/Platform-amd64.deb \
            release/Platform-x86_64.rpm \
            release/Platform-Setup.exe \
            release/Platform-Setup.exe.blockmap \
            release/latest-linux.yml \
            release/latest.yml
