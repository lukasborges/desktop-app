name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"
    paths-ignore:
      - "README.md"
      - "CHANGELOG.md"

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: macOS
            os: macos-latest
          - name: Windows
            # node-gyp 10 cannot detect the Visual Studio 18 installation
            # currently shipped by windows-latest.
            os: windows-2022
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install Linux test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes xvfb xauth

      - name: Configure Electron sandbox on Linux
        if: runner.os == 'Linux'
        run: echo "ELECTRON_DISABLE_SANDBOX=1" >> "$GITHUB_ENV"

      # Electron 43 downloads its platform binary lazily. Doing this before
      # Jest makes installation errors fail immediately instead of leaving
      # Electron test workers alive until the job timeout.
      - name: Install Electron binary
        run: yarn workspace platform-desktop-app exec electron --version

      - name: Build
        run: yarn build

      - name: Tests
        if: runner.os != 'Linux'
        run: yarn test

      - name: Tests
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum yarn test
